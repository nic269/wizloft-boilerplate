name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_saas_boilerplate
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d personal_saas_boilerplate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_saas_boilerplate
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WEB_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3002
      NEXT_PUBLIC_DOCS_URL: http://localhost:3003
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000/api/auth
      SKIP_ENV_VALIDATION: "false"
      MAIL_OUTBOX_DIR: apps/api/.data/mail
      MAIL_PROVIDER: console
      PLAYWRIGHT_REUSE_SERVER: "false"

    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names
      # the release each SHA belongs to.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Generate database client
        run: pnpm db:generate

      - name: Deploy database migrations
        run: pnpm db:migrate:deploy

      - name: Validate templates
        run: pnpm templates:validate

      - name: Check formatting and lint
        run: pnpm check:ci

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Check package boundaries
        run: pnpm boundaries

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run database integration
        run: pnpm --filter @repo/auth --filter @repo/api test:integration

      - name: Run browser identity journeys
        run: pnpm test:e2e
