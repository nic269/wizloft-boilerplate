packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "@prisma/client"
  - "core-js-pure"
  - "esbuild"
  - "prisma"
  - "sharp"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true

# Only resolve package versions that have been public for at least 7 days.
minimumReleaseAge: 10080

# Patched versions for vulnerable transitive dependencies. Keep each override
# within the major version its parents already accept; drop an entry once the
# parent package ships the fix itself.
overrides:
  baseline-browser-mapping@2: ^2.11.0
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  browserslist@4: ^4.28.7
  engine.io@6: ^6.6.10
  fast-uri@3: ^3.1.9
  hono@4: ^4.13.13
  "@hono/node-server@1": ^1.19.15
  js-yaml@4: ^4.3.2
  mysql2@3: ^3.23.1
  pbkdf2@3: ^3.1.7
  postcss-selector-parser@6: ^6.1.5
  postcss-selector-parser@7: ^7.1.6
  qs@6: ^6.16.1
  socket.io-parser@4: ^4.2.7
  source-map-js@1: ^1.2.2
  valibot@1: ^1.4.2
  vite@8: ^8.1.6
